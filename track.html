<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classic Cafe — Track Order</title><style>body{margin:0;background:#fff9f1;font-family:system-ui;color:#241715}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #eadccf;border-radius:22px;padding:20px;box-shadow:0 12px 30px #0001;margin:14px 0}.title{font:700 38px Georgia;color:#4b241d}.status{display:grid;gap:10px}.step{padding:13px;border-radius:12px;background:#f4eee8}.done{background:#dff5e7;color:#126b38}.active{background:#fff0cf;color:#875700;font-weight:800}.map{height:360px;border-radius:18px;overflow:hidden;background:#eee}.map iframe{width:100%;height:100%;border:0}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:10px 0}.green{background:#168447;color:white;border:0;border-radius:12px;padding:12px 16px;font-weight:800}.muted{color:#6f5b52}</style></head><body><div class="wrap"><div class="title">☕ Classic Cafe</div><div class="muted">Live Order Tracking</div><div id="app" class="card">Loading...</div></div><script>const token=new URLSearchParams(location.search).get('token');const steps=['NEW','ACCEPTED','PREPARING','OUT_FOR_DELIVERY','DELIVERED'];const labels={NEW:'Order Placed',ACCEPTED:'Confirmed',PREPARING:'Preparing',OUT_FOR_DELIVERY:'On The Way',DELIVERED:'Delivered'};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){if(!token){app.innerHTML='<b>Invalid tracking link.</b>';return}try{const r=await fetch('/api/track/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw Error(d.error||'Tracking failed');const o=d.order||{};const i=steps.indexOf(o.status);const list=steps.map((s,n)=>`<div class="step ${n<i?'done':n===i?'active':''}">${n<i?'✅':n===i?'🟡':'⚪'} ${labels[s]}</div>`).join('');let map='';if(o.location){const q=encodeURIComponent(o.location.lat+','+o.location.lng);map=`<div class="map"><iframe src="https://www.google.com/maps?q=${q}&output=embed" loading="lazy"></iframe></div>`}app.innerHTML=`<h2>Order ${esc(o.id)}</h2><p>👤 ${esc(o.customer_name)} · Status: <b>${esc(labels[o.status]||o.status)}</b></p><div class="status">${list}</div><div class="row"><span>Food</span><b>₹${o.food_total||0}</b></div><div class="row"><span>Delivery</span><b>₹${o.delivery_charge||0}</b></div><div class="row"><span>Total</span><b>₹${o.grand_total||0}</b></div>${o.location?'<p class="muted">📍 Delivery Boy live location — updating automatically.</p>'+map:'<p class="muted">🛵 Live location will appear when the Delivery Boy starts delivery.</p>'}<p><a class="green" href="tel:+918529625875">📞 Classic Cafe</a></p>`}catch(e){app.innerHTML='<b>Tracking error:</b> '+esc(e.message)}}load();setInterval(load,10000)</script></body></html>
