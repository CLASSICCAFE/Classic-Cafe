<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Classic Cafe Order</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#fff9f1;color:#211616}header{background:#241311;color:#fff;padding:18px}main{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #eadfd4;border-radius:18px;padding:16px;margin:12px 0}.status{font-weight:900;color:#168447}.steps{display:grid;gap:8px}.step{padding:11px;border-radius:10px;background:#f1ece7}.step.done{background:#e6f6ec}.muted{color:#725f55}#map{height:360px;border-radius:16px;overflow:hidden}.hidden{display:none}.total{font-size:18px;font-weight:900}</style></head><body><header><b>Classic Cafe Jodhpur</b><div class="muted" style="color:#f3dfca">Track Your Order</div></header><main><div id="out">Loading order…</div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const token=new URLSearchParams(location.search).get('token');let map,marker;const orderStatus=['NEW','ACCEPTED','PREPARING','OUT_FOR_DELIVERY','DELIVERED'];const labels={NEW:'Order Received',ACCEPTED:'Order Accepted',PREPARING:'Preparing',OUT_FOR_DELIVERY:'Out for Delivery 🚴',DELIVERED:'Delivered ✅',CANCELLED:'Cancelled'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(o){const idx=orderStatus.indexOf(o.status);let steps=o.status==='CANCELLED'?'<div class="step">❌ Order cancelled</div>':orderStatus.map((s,i)=>`<div class="step ${i<=idx?'done':''}">${i<=idx?'✅':'⚪'} ${labels[s]}</div>`).join('');let live=o.location&&o.status==='OUT_FOR_DELIVERY'?`<div class="card"><h3>🚴 Live Delivery Location</h3><p class="muted">Location last updated: ${new Date(o.location.updated_at).toLocaleTimeString()}</p><div id="map"></div></div>`:'';document.getElementById('out').innerHTML=`<div class="card"><h2>Order #${esc(o.id)}</h2><p>Hi ${esc(o.customer_name)}, your order status is <span class="status">${esc(labels[o.status]||o.status)}</span>.</p><div class="steps">${steps}</div></div><div class="card"><div class="total">Total ₹${o.grand_total}</div><p class="muted">Food ₹${o.food_total} + Delivery ₹${o.delivery_charge} · ${o.distance_km} KM</p></div>${live}`;if(live)showMap(o.location.lat,o.location.lng)}
function showMap(lat,lng){if(!map){map=L.map('map').setView([lat,lng],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);marker=L.marker([lat,lng]).addTo(map).bindPopup('Delivery Boy').openPopup()}else{marker.setLatLng([lat,lng]);map.setView([lat,lng],15)}}
async function load(){if(!token){out.innerHTML='<div class="card">❌ Tracking link is missing.</div>';return}try{const r=await fetch('/api/track/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load tracking');render(d.order)}catch(e){out.innerHTML='<div class="card">❌ '+esc(e.message)+'</div>'}}load();setInterval(load,10000);
</script></body></html>
