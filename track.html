<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order · Classic Cafe</title><style>body{margin:0;background:#fff9f1;color:#241715;font-family:system-ui}.wrap{max-width:650px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #eadfd4;border-radius:18px;padding:18px;margin:12px 0}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.step{padding:9px 4px;text-align:center;background:#f3e8dc;border-radius:10px;font-size:11px}.on{background:#168447;color:#fff;font-weight:800}@media(max-width:600px){.steps{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="card"><h1>☕ Classic Cafe</h1><h2>📦 Track Your Order</h2><div id="box">Loading…</div></div></main><script>const token=new URLSearchParams(location.search).get('token');const steps=['NEW','ACCEPTED','PREPARING','OUT_FOR_DELIVERY','DELIVERED'];const labels=['Received','Accepted','Preparing','Delivery','Delivered'];async function load(){if(!token){box.innerHTML='❌ Invalid tracking link.';return}try{const r=await fetch('/api/track/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw Error(d.error);const o=d.order,i=steps.indexOf(o.status);box.innerHTML=`<b>Order ${o.id}</b><br>Status: <b>${o.status}</b><div class="steps" style="margin:14px 0">${labels.map((x,n)=>`<span class="step ${n<=i?'on':''}">${x}</span>`).join('')}</div><p>💰 Total: ₹${o.grand_total}<br>💳 Payment: ${o.payment_status||'UNPAID'}<br>📍 Delivery distance: ${o.distance_km||'-'} KM</p>${o.location?`<p>🛵 Delivery Boy location available. <a target="_blank" href="https://www.google.com/maps?q=${o.location.lat},${o.location.lng}">Open Live Location</a></p>`:''}`;}catch(e){box.textContent='❌ '+e.message}}load();setInterval(load,10000)</script></body></html>
