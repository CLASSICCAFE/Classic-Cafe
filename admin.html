<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classic Cafe Admin</title><style>body{font-family:system-ui;margin:0;background:#fff9f1;color:#211616}header{background:#241311;color:#fff;padding:16px;position:sticky;top:0}main{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #eadfd4;border-radius:16px;padding:14px;margin:12px 0}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}button,input{padding:10px;border-radius:9px;border:1px solid #ddd;font:inherit}button{cursor:pointer;background:#241311;color:#fff}.status{padding:6px 9px;border-radius:12px;background:#f3e8dc}.danger{background:#ffe4e4}.ok{background:#e3f7e9}</style></head><body><header><b>Classic Cafe — Owner Dashboard</b></header><main><div class="card"><label>Owner Admin Key</label><input id="key" type="password" placeholder="ADMIN_KEY"><button onclick="load()">Open Orders</button></div><div id="out">Enter your Admin Key and open orders.</div></main><script>
let K='';const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){K=document.getElementById('key').value;const r=await fetch('/api/orders',{headers:{'x-admin-key':K}});const d=await r.json();if(!r.ok)return out.innerHTML='<div class="card">❌ '+esc(d.error)+'</div>';out.innerHTML=d.orders.map(o=>`<div class="card"><div class="row"><b>${esc(o.id)}</b><span class="status">${esc(o.status)}</span></div><p><b>${esc(o.customer_name)}</b> · ${esc(o.mobile)}<br>${esc(o.address)}</p><p>${o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</p><div>Food ₹${o.food_total} + Delivery ₹${o.delivery_charge} = <b>₹${o.grand_total}</b></div><p>Payment: ${esc(o.payment_status)} · ${new Date(o.created_at).toLocaleString()}</p><div class="row">${['NEW','ACCEPTED','PREPARING','OUT_FOR_DELIVERY','DELIVERED','CANCELLED'].map(s=>`<button onclick="setStatus('${o.id}','${s}')">${s}</button>`).join('')}</div></div>`).join('')||'<div class="card">No orders.</div>';}
async function setStatus(id,status){await fetch('/api/orders/'+id,{method:'PUT',headers:{'content-type':'application/json','x-admin-key':K},body:JSON.stringify({status})});load();}setInterval(()=>{if(K)load()},15000);
</script></body></html>
