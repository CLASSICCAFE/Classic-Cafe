<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classic Cafe Delivery Boy</title><style>:root{--brown:#241311;--gold:#d9a441;--cream:#fff9f1;--green:#168447;--red:#b42318;--line:#eadfd4}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:system-ui;color:#211616}header{background:linear-gradient(135deg,#241311,#4a2520);color:#fff;padding:18px}.wrap{max-width:800px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}input,button{font:inherit;padding:12px;border-radius:11px;width:100%;margin:5px 0}input{border:1px solid #ddd}button{border:0;background:#241311;color:#fff;font-weight:800}.gold{background:var(--gold);color:#21120e}.green{background:var(--green)}.red{background:var(--red)}.status{padding:6px 10px;border-radius:20px;background:#f3e8dc;font-size:12px;font-weight:800}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.small{font-size:12px;color:#777}.order{border:1px solid var(--line);border-radius:15px;padding:13px;margin:10px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{width:auto;flex:1}.hidden{display:none}</style></head><body><header><div class="wrap"><h2 style="margin:0">🛵 Classic Cafe</h2><div>Delivery Boy Dashboard</div></div></header><main class="wrap"><div id="login" class="card"><h2>🛵 Delivery Boy Login</h2><p>Apna registered 10-digit mobile number enter karein. OTP request ke baad Admin approval required hai.</p><input id="mobile" inputmode="numeric" maxlength="10" placeholder="10-digit mobile"><button class="gold" onclick="requestOtp()">📱 Request OTP</button><div id="msg" class="small"></div><div id="otpBox" class="hidden"><input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"><button class="green" onclick="verifyOtp()">🔓 Verify & Login</button></div></div><div id="app" class="hidden"><div class="card"><div class="row"><div><b id="boyName"></b><div class="small" id="boyMobile"></div></div><button style="width:auto" onclick="logout()">Logout</button></div></div><div class="card"><div class="row"><h3>📦 My Orders</h3><button class="gold" style="width:auto" onclick="loadOrders()">Refresh</button></div><div id="orders"></div></div></div></main><script>const $=id=>document.getElementById(id);let token=localStorage.getItem('classicDeliverySession')||'',BOY=null;async function api(p,o={}){let r=await fetch(p,{credentials:'same-origin',...o,headers:{...(o.headers||{}),'x-delivery-session':token}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||`Request failed ${r.status}`);return d}async function requestOtp(){let m=$('mobile').value.trim();if(!/^\d{10}$/.test(m))return $('msg').textContent='Valid 10-digit mobile required.';try{const d=await fetch('/api/delivery/otp/request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mobile:m})});const x=await d.json();if(!d.ok)throw Error(x.error||'OTP request failed');$('msg').textContent='✅ OTP request sent. Admin approval ke baad OTP enter karein.';$('otpBox').classList.remove('hidden')}catch(e){$('msg').textContent='❌ '+e.message}}async function verifyOtp(){let m=$('mobile').value.trim(),otp=$('otp').value.trim();try{const r=await fetch('/api/delivery/otp/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mobile:m,otp})});const d=await r.json();if(!r.ok)throw Error(d.error||'Verify failed');token=d.session_token;localStorage.setItem('classicDeliverySession',token);BOY=d.delivery_boy;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('boyName').textContent=BOY.name;$('boyMobile').textContent=BOY.mobile;loadOrders()}catch(e){$('msg').textContent='❌ '+e.message}}async function loadOrders(){try{const d=await api('/api/orders?limit=100');$('orders').innerHTML=(d.orders||[]).map(o=>`<div class="order"><div class="row"><b>${o.id}</b><span class="status">${o.status}</span></div><div>${o.customer_name}<br>📱 ${o.mobile}<br>📍 ${o.address}<br>💰 ₹${o.grand_total}</div><div class="actions"><button class="gold" onclick="status('${o.id}','OUT_FOR_DELIVERY')">🚴 Out for Delivery</button><button class="green" onclick="status('${o.id}','DELIVERED')">✅ Delivered</button><button onclick="loc('${o.id}')">📍 Send Location</button></div></div>`).join('')||'<div class="small">No assigned orders.</div>'}catch(e){if(String(e.message).includes('Unauthorized'))logout();else $('orders').innerHTML='❌ '+e.message}}async function status(id,s){try{await api('/api/orders/'+encodeURIComponent(id),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({status:s})});loadOrders()}catch(e){alert(e.message)}}async function loc(id){if(!navigator.geolocation)return alert('Location unavailable');navigator.geolocation.getCurrentPosition(async p=>{try{await api('/api/orders/'+encodeURIComponent(id)+'/location',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude})});loadOrders()}catch(e){alert(e.message)}},()=>alert('Location permission allow karein'))}function logout(){localStorage.removeItem('classicDeliverySession');location.reload()}if(token){api('/api/delivery/stats').then(()=>{fetch('/api/delivery/boys').catch(()=>{});$('login').classList.add('hidden');$('app').classList.remove('hidden');loadOrders()}).catch(()=>{})}</script></body></html>
