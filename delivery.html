<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classic Cafe Delivery</title><style>body{font-family:system-ui;margin:0;background:#f7f5f2;color:#211616}header{background:#241311;color:#fff;padding:16px;position:sticky;top:0}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #0001}.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}button,input{padding:11px;border-radius:9px;border:1px solid #ddd;font:inherit}button{background:#241311;color:#fff}.big{font-size:18px;font-weight:800}.status{font-weight:800}.live{background:#e4f8eb;color:#146b39;padding:8px;border-radius:10px;font-weight:700}.small{font-size:13px;color:#665}</style></head><body><header><b>Classic Cafe — Delivery Boy</b></header><main><div class="card"><input id="key" type="password" placeholder="DELIVERY_KEY"><button onclick="load()">Open My Orders</button></div><div id="out">Enter your delivery key.</div></main><script>
let K='';let watches={};const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){K=document.getElementById('key').value;const r=await fetch('/api/orders',{headers:{'x-delivery-key':K}});const d=await r.json();if(!r.ok){out.innerHTML='<div class="card">❌ Delivery key invalid.</div>';return}out.innerHTML=d.orders.filter(o=>!['DELIVERED','CANCELLED'].includes(o.status)).map(o=>`<div class="card"><div class="row"><span class="big">${esc(o.id)}</span><span class="status">${esc(o.status)}</span></div><p><b>${esc(o.customer_name)}</b> · <a href="tel:${esc(o.mobile)}">${esc(o.mobile)}</a><br>${esc(o.address)}</p><p>${o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</p><p>Total ₹${o.grand_total} · ${o.distance_km} KM</p><div class="row"><button onclick="setStatus('${o.id}','OUT_FOR_DELIVERY')">🚴 Out for Delivery</button><button onclick="startShare('${o.id}')">📍 ${watches[o.id]?'Sharing…':'Share Live Location'}</button><button onclick="setStatus('${o.id}','DELIVERED')">✅ Delivered</button></div><div id="live-${o.id}">${watches[o.id]?'<p class="live">🟢 Live location sharing is ON</p>':''}</div></div>`).join('')||'<div class="card">No active orders.</div>';}
async function startShare(id){if(!navigator.geolocation){alert('Location is not supported on this phone.');return}if(watches[id])return;if(!K)return;const opts={enableHighAccuracy:true,maximumAge:5000,timeout:15000};const send=async p=>{try{const r=await fetch('/api/orders/'+id+'/location',{method:'PUT',headers:{'content-type':'application/json','x-delivery-key':K},body:JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude})});if(!r.ok)throw Error('update failed')}catch(e){console.log(e)}};navigator.geolocation.getCurrentPosition(send,e=>alert('Location permission is required.'),opts);watches[id]=navigator.geolocation.watchPosition(send,e=>console.log(e),opts);load();}
async function setStatus(id,status){await fetch('/api/orders/'+id,{method:'PUT',headers:{'content-type':'application/json','x-delivery-key':K},body:JSON.stringify({status})});if(status==='DELIVERED'&&watches[id]){navigator.geolocation.clearWatch(watches[id]);delete watches[id]}load();}setInterval(()=>{if(K)load()},15000);
</script></body></html>
